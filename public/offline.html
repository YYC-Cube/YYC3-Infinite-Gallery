<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YYC3 Infinite Gallery - 离线模式</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    h1 { font-size: 2rem; margin-bottom: 1rem; }
    p { color: #999; font-size: 1.1rem; max-width: 400px; line-height: 1.6; }
    button {
      margin-top: 2rem;
      padding: 0.75rem 2rem;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 999px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: #e0e0e0; }
  </style>
</head>
<body>
  <h1>📴 当前处于离线状态</h1>
  <p>请检查你的网络连接后重试。部分已缓存的内容仍可访问。</p>
  <button onclick="location.reload()">🔄 重新加载</button>
</body>
</html>
