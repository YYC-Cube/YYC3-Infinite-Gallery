name: YYC³ Quality Gate & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 设置 GITHUB_TOKEN 的权限（Pages 部署所需最小权限）
permissions:
  contents: read
  pages: write
  id-token: write

# 允许一个并发部署，避免 Pages 竞态
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  PNPM_VERSION: 9.15.0
  # 使用 Node 22 LTS（Actions 已升级至 Node 24 运行时版本，无弃用告警）
  NODE_VERSION: 22

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test & Coverage Gate
        run: pnpm test:coverage

      - name: Docs standard check
        run: pnpm docs:check

      - name: Asset budget check
        run: pnpm assets:check

      - name: Security audit
        run: pnpm security:check

  build:
    name: Build
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 配置 Pages 环境（官方推荐步骤，确保 artifact 与 Pages 兼容）
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production

      # 守卫：构建产物文件名须兼容跨文件系统与制品上传（禁止冒号等非法字符）
      - name: Guard artifact-safe filenames
        run: |
          invalid=$(find ./out | grep -E '[:"<>|*?]' || true)
          if [ -n "$invalid" ]; then
            echo "::error::构建产物存在制品不安全文件名："
            echo "$invalid"
            exit 1
          fi

      # 供 E2E Job 复用，避免重复构建
      - name: Upload static output for E2E
        uses: actions/upload-artifact@v7
        with:
          name: static-out
          path: ./out
          retention-days: 1

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  e2e:
    name: E2E Critical Paths
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: static-out
          path: ./out

      - name: Run E2E tests
        run: pnpm test:e2e

  deploy:
    name: Deploy
    # 仅在 main 分支 push 时部署，PR 仅跑质量门禁与构建验证
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: e2e
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
